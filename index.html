<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio RP</title>
<style>
:root{--bg:#07090d;--hi:#5fd4ff;--tx:#cfe3f5;--mut:#7f90a4;--edge:#3b4452;--ink:#0a0d12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0,#14202e,var(--bg) 60%);color:var(--tx);font:15px/1.4 system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:70px 12px 24px;user-select:none;overflow-y:auto}
.radio{position:relative;width:100%;max-width:360px;padding:20px 18px 22px;border-radius:34px 34px 42px 42px;border:1px solid var(--edge);background:linear-gradient(165deg,#2c333e,#161a21 55%,#0d1015);box-shadow:inset 0 2px 0 #4a5666,inset 0 -6px 14px #0008,0 26px 60px #000c}
.antenna{position:absolute;top:-52px;left:40px;width:22px;height:60px;border-radius:11px 11px 3px 3px;background:linear-gradient(90deg,#07080b,#2d343f 45%,#07080b);border:1px solid #1b2028}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-left:64px}
.led{width:11px;height:11px;border-radius:50%;background:#14202d;box-shadow:inset 0 1px 2px #000}
.radio:has(.lcd.rx) .led{background:var(--hi);box-shadow:0 0 10px var(--hi)}
.radio:has(.lcd.tx) .led{background:#ff4b3e;box-shadow:0 0 10px #ff4b3e}
.brand{color:var(--mut);font-size:13px;letter-spacing:1px;flex:1}
.knob{width:38px;height:38px;border-radius:50%;background:repeating-conic-gradient(#1a1f27 0 8deg,#2e3642 8deg 16deg);border:2px solid #0a0c10;box-shadow:0 3px 6px #000a,inset 0 0 0 5px #11151b}
.lcd{background:#06141f;color:var(--hi);border-radius:12px;padding:14px;font-family:ui-monospace,Consolas,monospace;min-height:104px;border:3px solid var(--ink);box-shadow:0 0 0 2px var(--edge),inset 0 0 24px #0b5a8566;text-shadow:0 0 8px #5fd4ff88}
.lcd .freq{font-size:32px;font-weight:700;letter-spacing:1px;overflow:hidden;white-space:nowrap}
.lcd .st{margin-top:6px;font-size:14px;min-height:20px}
.lcd.rx{background:#082a40}
.lcd.tx{background:#2a0c0c;color:#ff9088;text-shadow:0 0 8px #ff4b3e88;box-shadow:0 0 0 2px var(--edge),inset 0 0 24px #ff4b3e44}
label{display:block;margin:14px 0 4px;color:var(--mut);font-size:13px}
input.f{width:100%;padding:12px;border-radius:8px;border:1px solid var(--edge);background:var(--ink);color:var(--tx);font-size:16px}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
button{font:inherit;cursor:pointer}
.join{width:100%;margin-top:18px;padding:14px;border:1px solid #0a0d12;border-radius:12px;background:linear-gradient(#3f8fd6,#1d5c99);color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 0 #0f3558}
.join:active{transform:translateY(3px);box-shadow:0 1px 0 #0f3558}
.err{color:#ff9d8f;margin-top:10px;min-height:20px;font-size:14px}
#room{display:none;margin-top:14px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ctl button{padding:10px;border-radius:10px;border:1px solid #0a0d12;background:linear-gradient(#2f3743,#1c222b);color:var(--tx);font-size:14px;box-shadow:0 3px 0 #07090d}
.ctl button[aria-pressed=true]{background:linear-gradient(#3f8fd6,#1d5c99);color:#fff;font-weight:700}
.vol{grid-column:1/3;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:4px 0 0}
.vol input{flex:1;padding:0;accent-color:var(--hi)}
.ptt{display:block;width:100%;height:96px;border-radius:20px;border:2px solid #0a0d12;background:repeating-linear-gradient(90deg,#0b0d11 0 6px,#171b22 6px 8px);color:var(--tx);font-size:21px;font-weight:700;box-shadow:0 7px 0 #05060a,0 12px 22px #000a,inset 0 0 0 1px var(--edge);touch-action:none;transition:transform .05s,box-shadow .05s}
.ptt.on{transform:translateY(6px);box-shadow:0 1px 0 #05060a,0 0 26px #3f8fd688,inset 0 0 0 1px var(--hi);background:repeating-linear-gradient(90deg,#10314d 0 6px,#18466d 6px 8px);color:#fff}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 8px}
ul{list-style:none;margin:0;padding:6px 10px;max-height:150px;overflow:auto;background:var(--ink);border-radius:10px;border:1px solid var(--edge)}
li{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid #1b222c}
li:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;background:#2c3644;flex:none}
li.talk{color:var(--hi)} li.talk .dot{background:var(--hi);box-shadow:0 0 8px var(--hi)}
.quit{width:100%;margin-top:14px;padding:10px;border-radius:10px;border:1px solid var(--edge);background:transparent;color:var(--mut)}
.grille{height:64px;margin-top:18px;border-radius:14px;background:radial-gradient(circle,#030405 2.2px,transparent 2.8px) 0 0/12px 12px,#12161c;box-shadow:inset 0 3px 8px #000c;border:1px solid #232a34}
#lobby{display:none;margin-top:14px}
.sec{margin:16px 0 6px;color:var(--mut);font-size:13px}
.who{color:var(--mut);font-size:13px}.who b{color:var(--hi)}
.row{display:flex;gap:8px}.row input{flex:1}
input.f+input.f{margin-top:8px}
.mini{padding:8px 12px;border-radius:8px;border:1px solid #0a0d12;background:linear-gradient(#3f8fd6,#1d5c99);color:#fff;font-size:13px;font-weight:700}
.mini.del{background:#2a1416;color:#ff9d8f;border-color:#4a2327}
#radios li{flex-wrap:wrap}
.rname{flex:1;min-width:110px}.cnt{color:var(--mut);font-size:12px}
.empty{color:var(--mut);font-size:13px}
#lobby .join{margin-top:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="radio">
  <div class="antenna"></div>
  <div class="top"><span class="led"></span><span class="brand">RP-400</span><span class="knob"></span></div>
  <div class="lcd" id="lcd"><div class="freq" id="freq">--.-</div><div class="st" id="st">Hors ligne</div></div>

  <form id="login" onsubmit="return false">
    <label for="name">Ton indicatif</label>
    <input class="f" id="name" maxlength="20" placeholder="ex: Adam-12" autocomplete="off">
    <button class="join" id="nextBtn">Continuer</button>
    <div class="err" id="err"></div>
  </form>

  <div id="lobby">
    <div class="who">Indicatif : <b id="who"></b></div>
    <div class="sec">Radios disponibles</div>
    <ul id="radios"></ul>
    <div class="sec">Rejoindre une fréquence</div>
    <div class="row"><input class="f" id="freqIn" maxlength="20" placeholder="ex: 155.5" autocomplete="off"><button class="mini" id="freqBtn">Rejoindre</button></div>
    <div class="sec">Créer une radio</div>
    <input class="f" id="newName" maxlength="24" placeholder="Nom de la radio" autocomplete="off">
    <input class="f" id="newPw" type="password" maxlength="30" placeholder="Mot de passe (facultatif)" autocomplete="new-password">
    <button class="join" id="createBtn">Créer et rejoindre</button>
    <div class="err" id="lerr"></div>
  </div>

  <div id="room">
    <div class="ctl">
      <button id="muteBtn" aria-pressed="false">Son coupé : non</button>
      <button id="modeBtn" aria-pressed="false">Mode : maintenir</button>
      <label class="vol">Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="1"></label>
    </div>
    <button class="ptt" id="ptt">Parler</button>
    <div class="hint" id="hint">Maintiens le bouton ou la touche V</div>
    <ul id="users"></ul>
    <button class="quit" id="quit">Éteindre</button>
  </div>
  <div class="grille"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database(), auth = firebase.auth();
const $ = id => document.getElementById(id);
let uid, name, chan, base, me, stream, talking = false, users = {}, peers = {}, queue = Promise.resolve(), ac, deaf = false, vol = 1, toggleMode = false;

$("name").value = localStorage.getItem("rp_name") || "";
const slug = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const sha = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(x => x.toString(16).padStart(2, "0")).join("");
const show = id => ["login", "lobby", "room"].forEach(x => $(x).style.display = x === id ? "block" : "none");
const say = (id, t) => $(id).textContent = t;
let radios = {}, counts = {}, watched = {};

/* ---------- Bips radio ---------- */
function beep(kind) {
  if (!ac || (deaf && (kind === "rx" || kind === "rxend"))) return;
  if (ac.state === "suspended") ac.resume();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "square"; o.frequency.value = kind === "tx" ? 1400 : kind === "rx" ? 1100 : 800;
  g.gain.value = 0.05; o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + (kind === "end" || kind === "rxend" ? 0.12 : 0.07));
}

/* ---------- Étape 1 : indicatif ---------- */
$("nextBtn").onclick = async () => {
  name = $("name").value.trim();
  if (!name) { say("err", "Choisis un indicatif."); return; }
  say("err", "");
  try { uid = (await auth.signInAnonymously()).user.uid; }
  catch (e) { say("err", "Connexion Firebase impossible : vérifie la config, l'auth anonyme et le domaine autorisé."); return; }
  localStorage.setItem("rp_name", name);
  $("who").textContent = name;
  show("lobby");
  db.ref("radios").on("value", s => { radios = s.val() || {}; renderRadios(); }, () => say("lerr", "Lecture des radios refusée : vérifie les règles de la base."));
};

/* ---------- Étape 2 : choisir ou créer une radio ---------- */
function renderRadios() {
  const ul = $("radios"); ul.innerHTML = "";
  const ks = Object.keys(radios);
  if (!ks.length) { ul.innerHTML = '<li class="empty">Aucune radio pour le moment. Crée la première.</li>'; return; }
  ks.forEach(k => {
    const r = radios[k];
    if (!r.locked && !watched[k]) { watched[k] = 1; db.ref("rooms/" + k + "/peers").on("value", s => { counts[k] = s.numChildren(); renderRadios(); }, () => {}); }
    const li = document.createElement("li");
    const t = document.createElement("span"); t.className = "rname"; t.textContent = r.name + (r.locked ? " (verrouillée)" : "");
    const n = document.createElement("span"); n.className = "cnt"; n.textContent = r.locked ? "" : (counts[k] || 0) + " en ligne";
    const j = document.createElement("button"); j.className = "mini"; j.textContent = "Rejoindre"; j.onclick = () => enter(k, r);
    li.append(t, n, j);
    if (r.by === uid) { const d = document.createElement("button"); d.className = "mini del"; d.textContent = "Supprimer"; d.onclick = () => delRadio(k); li.append(d); }
    ul.appendChild(li);
  });
}
async function delRadio(k) {
  if (!confirm("Supprimer cette radio ?")) return;
  try { await db.ref("secrets/" + k).remove(); await db.ref("radios/" + k).remove(); delete counts[k]; }
  catch (e) { say("lerr", "Suppression impossible."); }
}
$("freqBtn").onclick = async () => {
  const k = slug($("freqIn").value);
  if (!k) { say("lerr", "Entre une fréquence."); return; }
  let r; try { r = (await db.ref("radios/" + k).once("value")).val(); } catch (e) {}
  enter(k, r || { name: $("freqIn").value.trim().slice(0, 24) });
};
$("createBtn").onclick = async () => {
  const label = $("newName").value.trim(), k = slug(label), pw = $("newPw").value;
  if (!k) { say("lerr", "Donne un nom à ta radio."); return; }
  say("lerr", "");
  const data = { name: label.slice(0, 24), by: uid, locked: !!pw };
  let tx; try { tx = await db.ref("radios/" + k).transaction(c => c ? undefined : data); } catch (e) { say("lerr", "Création refusée : vérifie les règles de la base."); return; }
  if (!tx.committed) { say("lerr", "Ce nom de radio existe déjà."); return; }
  if (pw) {
    try { await db.ref("secrets/" + k).set(await sha(pw)); }
    catch (e) { await db.ref("radios/" + k).remove(); say("lerr", "Impossible de verrouiller la radio."); return; }
  }
  enter(k, data, pw);
};

/* ---------- Entrer dans une radio ---------- */
async function enter(k, r, pw) {
  say("lerr", "");
  if (r.locked && pw == null) { pw = prompt("Mot de passe de la radio " + r.name + " :"); if (pw == null) return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) { say("lerr", "Micro refusé ou indisponible (la page doit être en HTTPS)."); return; }
  stream.getAudioTracks()[0].enabled = false;
  chan = k; base = db.ref("rooms/" + k);
  if (r.locked) {
    try { await base.child("members/" + uid).set(await sha(pw)); }
    catch (e) { stream.getTracks().forEach(t => t.stop()); say("lerr", "Mot de passe incorrect."); return; }
  }
  me = base.child("peers/" + uid);
  try { await me.set({ name, talking: false }); }
  catch (e) { stream.getTracks().forEach(t => t.stop()); say("lerr", "Accès refusé à cette radio."); return; }
  me.onDisconnect().remove();
  const sig = base.child("signals/" + uid);
  sig.onDisconnect().remove();
  sig.on("child_added", s => { const m = s.val(); s.ref.remove(); queue = queue.then(() => handle(m)).catch(console.warn); });

  base.child("peers").on("child_added", s => {
    users[s.key] = s.val(); render();
    if (s.key !== uid && uid > s.key) offer(s.key);   // le plus grand uid appelle
  });
  base.child("peers").on("child_changed", s => {
    const was = users[s.key]; users[s.key] = s.val(); render();
    if (s.key !== uid && was && was.talking !== s.val().talking) beep(s.val().talking ? "rx" : "rxend");
  });
  base.child("peers").on("child_removed", s => { delete users[s.key]; closePeer(s.key); render(); });

  show("room");
  $("freq").textContent = r.name.toUpperCase().slice(0, 10);
  beep("rx"); render();
}

$("quit").onclick = async () => { try { await me.remove(); await base.child("signals/" + uid).remove(); } catch (e) {} location.reload(); };

/* ---------- WebRTC (signalisation via Firebase) ---------- */
const send = (to, msg) => base.child("signals/" + to).push(JSON.parse(JSON.stringify({ from: uid, ...msg })));

function mk(id) {
  const pc = new RTCPeerConnection(ICE);
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.onicecandidate = e => e.candidate && send(id, { k: "ice", d: e.candidate.toJSON() });
  pc.ontrack = e => {
    let a = $("a" + id);
    if (!a) { a = document.createElement("audio"); a.id = "a" + id; a.autoplay = true; document.body.appendChild(a); }
    a.srcObject = e.streams[0]; a.muted = deaf; a.volume = vol; a.play().catch(() => {});
  };
  pc.onconnectionstatechange = () => { if (pc.connectionState === "failed") closePeer(id); };
  return peers[id] = { pc, pend: [] };
}
function closePeer(id) {
  const p = peers[id]; if (p) { p.pc.close(); delete peers[id]; }
  const a = $("a" + id); if (a) a.remove();
}
async function flush(p) { for (const c of p.pend.splice(0)) await p.pc.addIceCandidate(c); }
async function offer(id) {
  closePeer(id); const p = mk(id);
  const o = await p.pc.createOffer(); await p.pc.setLocalDescription(o);
  send(id, { k: "offer", d: { type: o.type, sdp: o.sdp } });
}
async function handle(m) {
  let p = peers[m.from];
  if (m.k === "offer") {
    closePeer(m.from); p = mk(m.from);
    await p.pc.setRemoteDescription(m.d); await flush(p);
    const a = await p.pc.createAnswer(); await p.pc.setLocalDescription(a);
    send(m.from, { k: "answer", d: { type: a.type, sdp: a.sdp } });
  } else if (!p) return;
  else if (m.k === "answer") { await p.pc.setRemoteDescription(m.d); await flush(p); }
  else if (m.k === "ice") { p.pc.remoteDescription ? await p.pc.addIceCandidate(m.d) : p.pend.push(m.d); }
}

/* ---------- Push-to-talk ---------- */
function ptt(on) {
  if (!stream || talking === on) return;
  talking = on;
  stream.getAudioTracks()[0].enabled = on;
  me.update({ talking: on });
  beep(on ? "tx" : "end");
  $("ptt").classList.toggle("on", on);
  $("ptt").textContent = on ? "En émission" : "Parler";
  render();
}
const b = $("ptt");
b.addEventListener("pointerdown", e => {
  e.preventDefault(); b.setPointerCapture(e.pointerId);
  if (ac && ac.state === "suspended") ac.resume();
  document.querySelectorAll("audio").forEach(a => a.play().catch(() => {}));
  ptt(toggleMode ? !talking : true);
});
["pointerup", "pointercancel"].forEach(ev => b.addEventListener(ev, () => { if (!toggleMode) ptt(false); }));
b.addEventListener("contextmenu", e => e.preventDefault());
addEventListener("keydown", e => { if (e.code === "KeyV" && !e.repeat && document.activeElement.tagName !== "INPUT") ptt(toggleMode ? !talking : true); });
addEventListener("keyup", e => { if (e.code === "KeyV" && !toggleMode) ptt(false); });
addEventListener("blur", () => { if (!toggleMode) ptt(false); });

/* ---------- Muet, volume, mode ---------- */
const audios = () => document.querySelectorAll("audio");
$("muteBtn").onclick = () => {
  deaf = !deaf;
  audios().forEach(a => a.muted = deaf);
  $("muteBtn").setAttribute("aria-pressed", deaf);
  $("muteBtn").textContent = "Son coupé : " + (deaf ? "oui" : "non");
};
$("vol").oninput = e => { vol = +e.target.value; audios().forEach(a => a.volume = vol); };
$("modeBtn").onclick = () => {
  ptt(false); toggleMode = !toggleMode;
  $("modeBtn").setAttribute("aria-pressed", toggleMode);
  $("modeBtn").textContent = "Mode : " + (toggleMode ? "basculer" : "maintenir");
  $("hint").textContent = toggleMode ? "Appuie une fois pour parler, une fois pour couper le micro" : "Maintiens le bouton ou la touche V";
};

/* ---------- Affichage ---------- */
function render() {
  const lcd = $("lcd"), others = Object.entries(users).filter(([k, u]) => k !== uid && u.talking);
  lcd.className = "lcd" + (talking ? " tx" : others.length ? " rx" : "");
  $("st").textContent = !uid ? "Hors ligne" : talking ? "Émission..." : others.length ? "Reçoit : " + others.map(([, u]) => u.name).join(", ") : "Canal libre";
  const ul = $("users"); ul.innerHTML = "";
  Object.entries(users).forEach(([k, u]) => {
    const li = document.createElement("li"); if (u.talking) li.className = "talk";
    li.innerHTML = '<span class="dot"></span>'; li.append(u.name + (k === uid ? " (moi)" : ""));
    ul.appendChild(li);
  });
}
</script>
</body>
</html>
