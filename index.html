<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio RP</title>
<style>
:root{--bg:#12150d;--body:#2a3020;--edge:#3d4730;--lcd:#b9cb6e;--ink:#1d2409;--amber:#f0a81c;--red:#d9442f;--tx:#dfe5c9;--mut:#8f9a74}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:12px;user-select:none}
.radio{width:100%;max-width:380px;background:var(--body);border:2px solid var(--edge);border-radius:28px;padding:20px;box-shadow:0 24px 60px #000a}
.lcd{background:var(--lcd);color:var(--ink);border-radius:10px;padding:14px;font-family:ui-monospace,Consolas,monospace;box-shadow:inset 0 3px 8px #0006;min-height:110px}
.lcd .freq{font-size:34px;font-weight:700;letter-spacing:1px}
.lcd .st{margin-top:6px;font-size:14px;min-height:20px}
.lcd.tx{background:var(--amber)} .lcd.rx{background:#d8e69a}
label{display:block;margin:14px 0 4px;color:var(--mut);font-size:13px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--edge);background:#1a1f12;color:var(--tx);font-size:16px}
input:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button{font:inherit;cursor:pointer}
.join{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--amber);color:#2a1d00;font-weight:700;font-size:16px}
.err{color:#ff9d8f;margin-top:10px;min-height:20px;font-size:14px}
#room{display:none}
.ptt{display:block;width:170px;height:170px;margin:22px auto 8px;border-radius:50%;border:6px solid #11140b;background:radial-gradient(circle at 35% 30%,#e7573f,var(--red) 60%,#8f2616);color:#fff;font-size:20px;font-weight:700;box-shadow:0 8px 0 #5c1a0f,0 14px 24px #0008;touch-action:none;transition:transform .05s,box-shadow .05s}
.ptt.on{transform:translateY(6px);box-shadow:0 2px 0 #5c1a0f,0 4px 10px #0008;background:radial-gradient(circle at 35% 30%,#ffc04d,var(--amber) 60%,#a56c00);color:#2a1d00}
.hint{text-align:center;color:var(--mut);font-size:13px;margin-bottom:12px}
ul{list-style:none;margin:0;padding:0;max-height:170px;overflow:auto}
li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--edge)}
.dot{width:10px;height:10px;border-radius:50%;background:#59634a;flex:none}
li.talk .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)} li.talk{color:var(--amber)}
.quit{width:100%;margin-top:14px;padding:10px;border-radius:8px;border:1px solid var(--edge);background:transparent;color:var(--mut)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ctl button{padding:10px;border-radius:8px;border:1px solid var(--edge);background:#1a1f12;color:var(--tx);font-size:14px}
.ctl button[aria-pressed=true]{background:var(--amber);color:#2a1d00;border-color:var(--amber);font-weight:700}
.vol{grid-column:1/3;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.vol input{padding:0;accent-color:var(--amber)}
</style>
</head>
<body>
<div class="radio">
  <div class="lcd" id="lcd"><div class="freq" id="freq">--.-</div><div class="st" id="st">Hors ligne</div></div>

  <form id="login" onsubmit="return false">
    <label for="name">Indicatif</label>
    <input id="name" maxlength="20" placeholder="ex: Adam-12" autocomplete="off">
    <label for="chan">Fréquence</label>
    <input id="chan" maxlength="20" placeholder="ex: 155.5 ou police" autocomplete="off">
    <button class="join" id="joinBtn">Allumer la radio</button>
    <div class="err" id="err"></div>
  </form>

  <div id="room">
    <button class="ptt" id="ptt">Parler</button>
    <div class="hint" id="hint">Maintiens le bouton ou la touche V</div>
    <div class="ctl">
      <button id="muteBtn" aria-pressed="false">Son coupé : non</button>
      <button id="modeBtn" aria-pressed="false">Mode : maintenir</button>
      <label class="vol">Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="1"></label>
    </div>
    <ul id="users"></ul>
    <button class="quit" id="quit">Éteindre</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database(), auth = firebase.auth();
const $ = id => document.getElementById(id);
let uid, name, chan, base, me, stream, talking = false, users = {}, peers = {}, queue = Promise.resolve(), ac, deaf = false, vol = 1, toggleMode = false;

$("name").value = localStorage.getItem("rp_name") || "";
$("chan").value = localStorage.getItem("rp_chan") || "";
const slug = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

/* ---------- Bips radio ---------- */
function beep(kind) {
  if (!ac || (deaf && (kind === "rx" || kind === "rxend"))) return;
  if (ac.state === "suspended") ac.resume();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "square"; o.frequency.value = kind === "tx" ? 1400 : kind === "rx" ? 1100 : 800;
  g.gain.value = 0.05; o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + (kind === "end" || kind === "rxend" ? 0.12 : 0.07));
}

/* ---------- Connexion ---------- */
$("joinBtn").onclick = async () => {
  name = $("name").value.trim(); chan = slug($("chan").value);
  if (!name || !chan) { $("err").textContent = "Renseigne ton indicatif et une fréquence."; return; }
  $("err").textContent = "";
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) { $("err").textContent = "Micro refusé ou indisponible (la page doit être en HTTPS)."; return; }
  stream.getAudioTracks()[0].enabled = false;
  try { uid = (await auth.signInAnonymously()).user.uid; }
  catch (e) { $("err").textContent = "Connexion Firebase impossible : vérifie la config et l'auth anonyme."; return; }
  localStorage.setItem("rp_name", name); localStorage.setItem("rp_chan", $("chan").value);

  base = db.ref("rooms/" + chan);
  me = base.child("peers/" + uid);
  await me.set({ name, talking: false });
  me.onDisconnect().remove();
  const sig = base.child("signals/" + uid);
  sig.onDisconnect().remove();
  sig.on("child_added", s => { const m = s.val(); s.ref.remove(); queue = queue.then(() => handle(m)).catch(console.warn); });

  base.child("peers").on("child_added", s => {
    users[s.key] = s.val(); render();
    if (s.key !== uid && uid > s.key) offer(s.key);   // le plus grand uid appelle
  });
  base.child("peers").on("child_changed", s => {
    const was = users[s.key]; users[s.key] = s.val(); render();
    if (s.key !== uid && was && was.talking !== s.val().talking) beep(s.val().talking ? "rx" : "rxend");
  });
  base.child("peers").on("child_removed", s => { delete users[s.key]; closePeer(s.key); render(); });

  $("login").style.display = "none"; $("room").style.display = "block";
  $("freq").textContent = $("chan").value.toUpperCase().slice(0, 10);
  beep("rx"); render();
};

$("quit").onclick = async () => { try { await me.remove(); await base.child("signals/" + uid).remove(); } catch (e) {} location.reload(); };

/* ---------- WebRTC (signalisation via Firebase) ---------- */
const send = (to, msg) => base.child("signals/" + to).push(JSON.parse(JSON.stringify({ from: uid, ...msg })));

function mk(id) {
  const pc = new RTCPeerConnection(ICE);
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.onicecandidate = e => e.candidate && send(id, { k: "ice", d: e.candidate.toJSON() });
  pc.ontrack = e => {
    let a = $("a" + id);
    if (!a) { a = document.createElement("audio"); a.id = "a" + id; a.autoplay = true; document.body.appendChild(a); }
    a.srcObject = e.streams[0]; a.muted = deaf; a.volume = vol; a.play().catch(() => {});
  };
  pc.onconnectionstatechange = () => { if (pc.connectionState === "failed") closePeer(id); };
  return peers[id] = { pc, pend: [] };
}
function closePeer(id) {
  const p = peers[id]; if (p) { p.pc.close(); delete peers[id]; }
  const a = $("a" + id); if (a) a.remove();
}
async function flush(p) { for (const c of p.pend.splice(0)) await p.pc.addIceCandidate(c); }
async function offer(id) {
  closePeer(id); const p = mk(id);
  const o = await p.pc.createOffer(); await p.pc.setLocalDescription(o);
  send(id, { k: "offer", d: { type: o.type, sdp: o.sdp } });
}
async function handle(m) {
  let p = peers[m.from];
  if (m.k === "offer") {
    closePeer(m.from); p = mk(m.from);
    await p.pc.setRemoteDescription(m.d); await flush(p);
    const a = await p.pc.createAnswer(); await p.pc.setLocalDescription(a);
    send(m.from, { k: "answer", d: { type: a.type, sdp: a.sdp } });
  } else if (!p) return;
  else if (m.k === "answer") { await p.pc.setRemoteDescription(m.d); await flush(p); }
  else if (m.k === "ice") { p.pc.remoteDescription ? await p.pc.addIceCandidate(m.d) : p.pend.push(m.d); }
}

/* ---------- Push-to-talk ---------- */
function ptt(on) {
  if (!stream || talking === on) return;
  talking = on;
  stream.getAudioTracks()[0].enabled = on;
  me.update({ talking: on });
  beep(on ? "tx" : "end");
  $("ptt").classList.toggle("on", on);
  $("ptt").textContent = on ? "En émission" : "Parler";
  render();
}
const b = $("ptt");
b.addEventListener("pointerdown", e => {
  e.preventDefault(); b.setPointerCapture(e.pointerId);
  if (ac && ac.state === "suspended") ac.resume();
  document.querySelectorAll("audio").forEach(a => a.play().catch(() => {}));
  ptt(toggleMode ? !talking : true);
});
["pointerup", "pointercancel"].forEach(ev => b.addEventListener(ev, () => { if (!toggleMode) ptt(false); }));
b.addEventListener("contextmenu", e => e.preventDefault());
addEventListener("keydown", e => { if (e.code === "KeyV" && !e.repeat && document.activeElement.tagName !== "INPUT") ptt(toggleMode ? !talking : true); });
addEventListener("keyup", e => { if (e.code === "KeyV" && !toggleMode) ptt(false); });
addEventListener("blur", () => { if (!toggleMode) ptt(false); });

/* ---------- Muet, volume, mode ---------- */
const audios = () => document.querySelectorAll("audio");
$("muteBtn").onclick = () => {
  deaf = !deaf;
  audios().forEach(a => a.muted = deaf);
  $("muteBtn").setAttribute("aria-pressed", deaf);
  $("muteBtn").textContent = "Son coupé : " + (deaf ? "oui" : "non");
};
$("vol").oninput = e => { vol = +e.target.value; audios().forEach(a => a.volume = vol); };
$("modeBtn").onclick = () => {
  ptt(false); toggleMode = !toggleMode;
  $("modeBtn").setAttribute("aria-pressed", toggleMode);
  $("modeBtn").textContent = "Mode : " + (toggleMode ? "basculer" : "maintenir");
  $("hint").textContent = toggleMode ? "Appuie une fois pour parler, une fois pour couper le micro" : "Maintiens le bouton ou la touche V";
};

/* ---------- Affichage ---------- */
function render() {
  const lcd = $("lcd"), others = Object.entries(users).filter(([k, u]) => k !== uid && u.talking);
  lcd.className = "lcd" + (talking ? " tx" : others.length ? " rx" : "");
  $("st").textContent = !uid ? "Hors ligne" : talking ? "Émission..." : others.length ? "Reçoit : " + others.map(([, u]) => u.name).join(", ") : "Canal libre";
  const ul = $("users"); ul.innerHTML = "";
  Object.entries(users).forEach(([k, u]) => {
    const li = document.createElement("li"); if (u.talking) li.className = "talk";
    li.innerHTML = '<span class="dot"></span>'; li.append(u.name + (k === uid ? " (moi)" : ""));
    ul.appendChild(li);
  });
}
</script>
</body>
</html>
